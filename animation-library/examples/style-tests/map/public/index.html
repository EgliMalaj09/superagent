<!doctype html><html lang="sq"><head><meta charset="utf-8"/><style>
/* ===== animation-library base: every library font + shared components. Sizes come from --W / --H set by build_page.py ===== */
@font-face { font-family:"Arc"; src:url("fonts/ArchivoC-600.woff2") format("woff2"); font-weight:600; font-style:normal; font-display:block; }
@font-face { font-family:"Arc"; src:url("fonts/ArchivoC-800.woff2") format("woff2"); font-weight:800; font-style:normal; font-display:block; }
@font-face { font-family:"BG"; src:url("fonts/Bricolage-800.woff2") format("woff2"); font-weight:800; font-style:normal; font-display:block; }
@font-face { font-family:"DM"; src:url("fonts/DMSans-400.woff2") format("woff2"); font-weight:400; font-style:normal; font-display:block; }
@font-face { font-family:"DM"; src:url("fonts/DMSans-500.woff2") format("woff2"); font-weight:500; font-style:normal; font-display:block; }
@font-face { font-family:"DM"; src:url("fonts/DMSans-700.woff2") format("woff2"); font-weight:700; font-style:normal; font-display:block; }
@font-face { font-family:"HG"; src:url("fonts/HankenGrotesk-300-normal.woff2") format("woff2"); font-weight:300; font-style:normal; font-display:block; }
@font-face { font-family:"HG"; src:url("fonts/HankenGrotesk-500-normal.woff2") format("woff2"); font-weight:500; font-style:normal; font-display:block; }
@font-face { font-family:"HG"; src:url("fonts/HankenGrotesk-700-normal.woff2") format("woff2"); font-weight:700; font-style:normal; font-display:block; }
@font-face { font-family:"IS"; src:url("fonts/InstrumentSerif-400-italic.woff2") format("woff2"); font-weight:400; font-style:italic; font-display:block; }
@font-face { font-family:"IS"; src:url("fonts/InstrumentSerif-400-normal.woff2") format("woff2"); font-weight:400; font-style:normal; font-display:block; }
@font-face { font-family:"Inter"; src:url("fonts/Inter-400-normal.woff2") format("woff2"); font-weight:400; font-style:normal; font-display:block; }
@font-face { font-family:"Inter"; src:url("fonts/Inter-500-normal.woff2") format("woff2"); font-weight:500; font-style:normal; font-display:block; }
@font-face { font-family:"Inter"; src:url("fonts/Inter-600-normal.woff2") format("woff2"); font-weight:600; font-style:normal; font-display:block; }
@font-face { font-family:"Osw"; src:url("fonts/Oswald-500.woff2") format("woff2"); font-weight:500; font-style:normal; font-display:block; }
@font-face { font-family:"Osw"; src:url("fonts/Oswald-700.woff2") format("woff2"); font-weight:700; font-style:normal; font-display:block; }
@font-face { font-family:"Out"; src:url("fonts/Outfit-500-normal.woff2") format("woff2"); font-weight:500; font-style:normal; font-display:block; }
@font-face { font-family:"Out"; src:url("fonts/Outfit-700-normal.woff2") format("woff2"); font-weight:700; font-style:normal; font-display:block; }
@font-face { font-family:"Out"; src:url("fonts/Outfit-800-normal.woff2") format("woff2"); font-weight:800; font-style:normal; font-display:block; }
@font-face { font-family:"Ser"; src:url("fonts/SourceSerif4-600.woff2") format("woff2"); font-weight:600; font-style:italic; font-display:block; }
@font-face { font-family:"Ser"; src:url("fonts/SourceSerif4-700.woff2") format("woff2"); font-weight:700; font-style:italic; font-display:block; }
@font-face { font-family:"Type"; src:url("fonts/SpecialElite-400.woff2") format("woff2"); font-weight:400; font-style:normal; font-display:block; }
@font-face { font-family:"Spec"; src:url("fonts/Spectral-600-italic.woff2") format("woff2"); font-weight:600; font-style:italic; font-display:block; }
@font-face { font-family:"Spec"; src:url("fonts/Spectral-700-italic.woff2") format("woff2"); font-weight:700; font-style:italic; font-display:block; }
/* Font families: Arc = Archivo Condensed 600/800, BG = Bricolage 800, DM = DM Sans, HG = Hanken Grotesk 300/500/700,
   IS = Instrument Serif (+italic), Inter, Osw = Oswald 500/700, Out = Outfit 500-800, Ser = Source Serif 4 italic 600/700,
   Type = Special Elite (typewriter), Spec = Spectral italic 600/700. All support Albanian ë ç. */
* { box-sizing:border-box; }
html, body { margin:0; padding:0; width:var(--W); height:var(--H); overflow:hidden; background:var(--bg); }
#stage { position:relative; width:var(--W); height:var(--H); overflow:hidden; background:var(--bg); color:var(--ink); font-family:var(--body); }
.L { position:absolute; left:0; top:0; width:var(--W); height:var(--H); overflow:hidden; pointer-events:none; }
.bg { background:var(--bgfx, var(--bg)); }
/* text */
.h  { font-family:var(--head); font-weight:var(--headw, 800); color:var(--ink); letter-spacing:var(--track, -.02em); line-height:1.02; }
.kicker { font-family:var(--body); font-weight:700; font-size:30px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
.body { font-family:var(--body); font-weight:500; font-size:40px; line-height:1.25; color:var(--ink); }
.quote { font-family:var(--quote); font-style:italic; font-size:64px; line-height:1.12; color:var(--ink); }
.num { font-family:var(--head); font-weight:var(--headw, 800); font-size:220px; line-height:.9; color:var(--accent); font-variant-numeric:tabular-nums; }
.src { position:absolute; left:70px; bottom:110px; font-family:var(--body); font-weight:500; font-size:22px; letter-spacing:.02em; color:var(--mute); }
/* highlighter: <span class="hl"><i></i><b>word</b></span>, animate i scaleX 0→1 */
.hl { position:relative; display:inline-block; padding:0 .12em; }
.hl > i { position:absolute; left:0; right:0; top:.18em; bottom:.06em; background:var(--hi); transform-origin:0 50%; transform:scaleX(0); z-index:0; }
.hl > b { position:relative; z-index:1; font-weight:inherit; }
/* parts */
.card { position:absolute; background:var(--card); border-radius:var(--radius, 18px); box-shadow:var(--shadow, 0 20px 50px rgba(0,0,0,.18)); padding:36px 40px; }
.photo { position:absolute; object-fit:cover; border-radius:var(--radius, 12px); box-shadow:var(--shadow, 0 20px 50px rgba(0,0,0,.25)); }
.stamp { position:absolute; font-family:var(--head); font-weight:800; font-size:120px; color:var(--red); border:10px solid var(--red); padding:8px 34px; transform:rotate(-8deg); letter-spacing:.04em; mix-blend-mode:multiply; }
.bar { position:absolute; bottom:0; width:120px; background:var(--accent); transform-origin:50% 100%; }   /* animate scaleY */
.rule { position:absolute; height:6px; background:var(--accent); transform-origin:0 50%; }                   /* animate scaleX */
.grain { position:absolute; inset:0; pointer-events:none; opacity:.06; background-image:radial-gradient(rgba(0,0,0,.9) 1px, transparent 1.3px); background-size:4px 4px; }
.vignette { position:absolute; inset:0; pointer-events:none; background:radial-gradient(120% 80% at 50% 45%, transparent 55%, rgba(0,0,0,.35) 100%); }
/* safe zones (Reels UI): keep text inside top 220px … bottom 380px on 9:16 */
/* MAP / geography (deep navy, glowing routes, d3 + topojson world map from vendor/countries-50m.json) */
:root { --bg:#0C1626; --ink:#EAF0F7; --mute:rgba(234,240,247,.72); --accent:#4FD1C5; --hi:#F6C344; --red:#F25C54; --card:#132239;
  --head:"Out", Arial, sans-serif; --headw:800; --track:-.02em; --body:"Inter", Arial, sans-serif; --quote:"Ser", Georgia, serif;
  --bgfx: radial-gradient(100% 70% at 50% 40%, #13243D 0%, #0C1626 75%); --land:#1D3352; --border:rgba(234,240,247,.25); --radius:14px; }
.route { fill:none; stroke:var(--hi); stroke-width:4; stroke-linecap:round; filter:drop-shadow(0 0 8px var(--hi)); }  /* animate strokeDashoffset */
.pin { position:absolute; width:22px; height:22px; border-radius:50%; background:var(--red); box-shadow:0 0 0 8px rgba(242,92,84,.25); }
/* project-only CSS (wins over the style kit) */

:root { --W:1080px; --H:1920px; }

</style></head><body>
<div id="stage" data-composition-id="_test_map" data-start="0" data-duration="6.00" data-fps="30" data-width="1080" data-height="1920">
<div class="L bg clip" id="bg" data-start="0" data-duration="6.00" data-track-index="1">
  <div id="mcam" style="position:absolute;left:0;top:0;transform-origin:0 0;">
    <svg id="map" width="2400" height="2400"></svg>
    <svg id="routes" width="2400" height="2400" style="position:absolute;left:0;top:0;"></svg>
    <div id="pins" style="position:absolute;left:0;top:0;"></div>
  </div>
</div>
<div class="L clip" data-start="0" data-duration="6.00" data-track-index="2">
  <div style="position:absolute;left:8%;right:8%;top:12%;"><div class="kicker" id="k1">EMIGRIMI</div>
    <div class="h" id="h1" style="font-size:88px;margin-top:16px;">From Tirana to <span class="hl"><i id="hl1"></i><b>Rome</b></span></div></div>
  <div class="src" id="src1">Burimi: put the real source here</div>
</div>

<audio id="bed" src="sfx/bed.wav" data-start="0" data-duration="6.000" data-track-index="90" data-volume="0.07"></audio>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson.min.js"></script>
<script src="vendor/world.js"></script>
<script>
(function () {
  const W = 1080, H = 1920, D = 6.00;
  const tl = window.gsap.timeline({ paused: true });
// ===== animation-library MOTION KIT — loaded into every page before scene.js. `tl` (paused GSAP timeline), W, H exist already. =====
// Rules baked in: transforms + opacity only (no top/left/width/height tweens), fromTo with immediateRender:false for later entrances,
// seeded random only (never Math.random), soft eases (power3.out 0.3–0.45 s), no shakes, no flashes.
let seed = 5; const rnd = function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const E = 'expo.out';
const $ = function (s) { return typeof s === 'string' ? document.querySelector(s) : s; };
const div = function (p, css, cls) { const d = document.createElement('div'); d.style.cssText = css || ''; if (cls) d.className = cls; $(p).appendChild(d); return d; };
const show = function (sel, t) { tl.set(sel, { opacity: 1 }, t); };
const hide = function (sel, t) { tl.set(sel, { opacity: 0 }, t); };
// entrances
const up = function (sel, t, d) { tl.fromTo(sel, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: d || 0.5, ease: E, immediateRender: false }, t); };
const fadeIn = function (sel, t, d) { tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d || 0.4, ease: 'power2.out', immediateRender: false }, t); };
const pop = function (sel, t, d) { tl.fromTo(sel, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: d || 0.45, ease: 'back.out(1.7)', immediateRender: false }, t); };
const slideIn = function (sel, t, from, d) { const v = { opacity: 0 }; v[from === 'left' || from === 'right' ? 'x' : 'y'] = (from === 'left' || from === 'top' ? -1 : 1) * 120;
  tl.fromTo(sel, v, { x: 0, y: 0, opacity: 1, duration: d || 0.45, ease: 'power3.out', immediateRender: false }, t); };
const blurIn = function (sel, t, d) { tl.fromTo(sel, { opacity: 0, filter: 'blur(18px)', scale: 1.06 }, { opacity: 1, filter: 'blur(0px)', scale: 1, duration: d || 0.6, ease: 'power3.out', immediateRender: false }, t); };
const words = function (sel, t, gap) {   // word-by-word reveal: wraps each word of the element in a span
  const el = $(sel); const w = el.textContent.trim().split(/\s+/); el.innerHTML = w.map(function (x) { return '<span style="display:inline-block;opacity:0">' + x + '</span>'; }).join(' ');
  el.querySelectorAll('span').forEach(function (s, i) { tl.fromTo(s, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out', immediateRender: false }, t + i * (gap || 0.07)); });
};
// exits
const out = function (sel, t, d) { tl.to(sel, { opacity: 0, y: -20, duration: d || 0.35, ease: 'power2.in' }, t); };
const fadeOut = function (sel, t, d) { tl.to(sel, { opacity: 0, duration: d || 0.35, ease: 'power2.inOut' }, t); };
// emphasis
const hl = function (sel, t) { tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: 'power2.out', immediateRender: false }, t); };   // .hl > i, .rule
const growY = function (sel, t, d, stagger) { tl.fromTo(sel, { scaleY: 0 }, { scaleY: 1, duration: d || 0.7, ease: 'power3.out', stagger: stagger || 0.08, immediateRender: false }, t); };  // .bar
const stamp = function (sel, t) { tl.fromTo(sel, { scale: 2.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.32, ease: 'power4.in', immediateRender: false }, t); };
const count = function (sel, a, b, t, dur, fmt) {   // fmt e.g. function (v) { return v.toFixed(1) + ' m²'; }
  const el = $(sel); const o = { v: a }; fmt = fmt || function (v) { return Math.round(v).toLocaleString('de-DE'); };
  tl.fromTo(o, { v: a }, { v: b, duration: dur, ease: 'power2.out', immediateRender: false, onUpdate: function () { el.textContent = fmt(o.v); } }, t);
  el.textContent = fmt(a);
};
const typeIn = function (sel, text, t, dur) {   // typewriter: GSAP cannot tween textContent, so drive a proxy
  const el = $(sel); const o = { n: 0 };
  tl.fromTo(o, { n: 0 }, { n: text.length, duration: dur || text.length * 0.04, ease: 'none', immediateRender: false, onUpdate: function () { el.textContent = text.slice(0, Math.round(o.n)); } }, t);
};
const draw = function (path, t, dur) {   // SVG line draw
  const p = $(path); const L = p.getTotalLength(); p.style.strokeDasharray = L;
  tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: dur || 1.2, ease: 'power2.inOut', immediateRender: true }, t);
};
const kenBurns = function (sel, t, dur, from, to) { tl.fromTo(sel, { scale: from || 1.0 }, { scale: to || 1.12, duration: dur, ease: 'none', immediateRender: true }, t); };
const drift = function (sel, t, dur, dx, dy) { tl.to(sel, { x: '+=' + (dx || 0), y: '+=' + (dy || -30), duration: dur, ease: 'none' }, t); };
// scene change inside one page: fade the old layer out while the new one fades in (0.35–0.4 s)
const xfade = function (a, b, t, d) { tl.to(a, { opacity: 0, duration: d || 0.4, ease: 'power2.inOut' }, t); tl.fromTo(b, { opacity: 0 }, { opacity: 1, duration: d || 0.4, ease: 'power2.inOut', immediateRender: false }, t); };
// After the voice-over arrives: retime the whole timeline. pts = [[oldTime, newTime], ...] ascending, e.g. [[0,0],[3.2,2.9],[8,9.4]]
const remap = function (pts) {
  const m = function (s) { for (let i = 1; i < pts.length; i++) if (s <= pts[i][0]) { const a = pts[i - 1], b = pts[i]; return a[1] + (s - a[0]) * (b[1] - a[1]) / (b[0] - a[0]); }
    const a = pts[pts.length - 2], b = pts[pts.length - 1]; return b[1] + (s - b[0]) * (b[1] - a[1]) / (b[0] - a[0]); };
  tl.getChildren(false, true, true).forEach(function (c) { const s = c.startTime(), e = s + c.totalDuration(), ns = m(s); c.startTime(ns); if (c.totalDuration() > 0) c.totalDuration(Math.max(0.001, m(e) - ns)); });
};

// ===== MAP ENGINE (d3 + topojson, offline world map). Needs motion.js. Page needs:
//   <div class="L" style="overflow:hidden"><div id="mcam" style="position:absolute;left:0;top:0;transform-origin:0 0">
//     <svg id="map" width="2400" height="2400"></svg><svg id="routes" width="2400" height="2400" style="position:absolute;left:0;top:0"></svg><div id="pins"></div></div></div>
// usage: const M = makeMap({ center:[20,41], scale:5000, highlight:['008'] });  (ISO numeric ids: 008 Albania, 380 Italy, 300 Greece …)
//        M.pin('tr', 19.82, 41.33, 'Tiranë'); M.route([19.8,41.3],[12.5,41.9], t, dur); M.camTo([19.8,41.3], 1.8, t, dur)
const makeMap = function (o) {
  const world = window.__WORLD__;
  const proj = d3.geoMercator().center(o.center).scale(o.scale).translate([1200, 1200]);
  const path = d3.geoPath(proj);
  const land = topojson.feature(world, world.objects.countries).features;
  d3.select('#map').selectAll('path').data(land).enter().append('path').attr('d', path)
    .attr('fill', function (d) { return (o.highlight || []).indexOf(d.id) >= 0 ? 'var(--accent)' : 'var(--land, #1D3352)'; })
    .attr('stroke', 'var(--border, rgba(255,255,255,.25))').attr('stroke-width', 1.2);
  const P = function (lon, lat) { return proj([lon, lat]); };
  const pin = function (id, lon, lat, label, side) {
    const p = P(lon, lat); const d = div('#pins', 'left:' + (p[0] - 11) + 'px;top:' + (p[1] - 11) + 'px;', 'pin'); d.id = id;
    if (label) { const s = div(d, 'position:absolute;top:-8px;white-space:nowrap;font:700 30px var(--body);color:var(--ink);' + (side === 'l' ? 'right:34px;' : 'left:34px;')); s.setAttribute('data-layout-allow-overflow', ''); s.textContent = label; }
    tl.set(d, { scale: 0 }, 0); return { el: d, p: p, show: function (t) { tl.to(d, { scale: 1, duration: 0.35, ease: 'back.out(2)' }, t); } };
  };
  const route = function (a, b, t, dur, bend) {
    const A = P(a[0], a[1]), B = P(b[0], b[1]), mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2 - (bend == null ? 200 : bend);
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    r.setAttribute('d', 'M' + A[0] + ' ' + A[1] + ' Q ' + mx + ' ' + my + ' ' + B[0] + ' ' + B[1]); r.setAttribute('class', 'route');
    document.getElementById('routes').appendChild(r); draw(r, t, dur || 1.4); return r;
  };
  const cam = function (pt, s, Y) { return { scale: s, x: W / 2 - s * pt[0], y: (Y || H * 0.43) - s * pt[1] }; };
  const camTo = function (lonlat, s, t, dur, ease, Y) { const v = cam(P(lonlat[0], lonlat[1]), s, Y);
    if (!dur) tl.set('#mcam', v, t || 0); else tl.to('#mcam', Object.assign(v, { duration: dur, ease: ease || 'power2.inOut' }), t); };
  return { P: P, pin: pin, route: route, camTo: camTo, proj: proj };
};

// ---- scene ----
const M = makeMap({ center: [17, 42], scale: 3800, highlight: ['008'] });   // 008 = Albania
const tr = M.pin('tr', 19.82, 41.33, 'Tiranë', 'r'), ro = M.pin('ro', 12.50, 41.90, 'Roma', 'l');
M.camTo([19.8, 41.3], 1.6, 0, 0);
M.camTo([19.8, 41.3], 1.8, 0, 1.2, 'none');
tr.show(0.5);
M.camTo([16.1, 41.6], 1.1, 1.2, 1.4);
M.route([19.82, 41.33], [12.5, 41.9], 1.4, 1.5);
ro.show(2.8);
up('#k1', 0.2); up('#h1', 0.45); hl('#hl1', 2.9); fadeIn('#src1', 3.2);

  tl.to({}, { duration: D }, 0);
  window.__timelines = window.__timelines || {}; window.__timelines["_test_map"] = tl;
})();
</script>
</div></body></html>
